version: '3'

vars:
  APP_NAME: tictactoe
  MAIN_PATH: ./cmd/main.go
  BIN_DIR: ./bin

tasks:
  build:
    desc: Build the application binary
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.APP_NAME}} {{.MAIN_PATH}}

  run:
    desc: Run the application
    cmds:
      - go run {{.MAIN_PATH}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
